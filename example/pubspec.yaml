name: wallet_cloud_backup_example
description: Demo app and on-device tests for wallet_cloud_backup.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  cryptography: ^2.9.0
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  huawei_account: ^6.13.0+300
  huawei_drive: ^5.0.1+300
  huawei_hmsavailability: ^6.13.0+300
  path: ^1.9.1
  path_provider: ^2.1.6
  wallet_cloud_backup:
    path: ../
  wallet_core:
    git:
      url: https://github.com/grantsamuel72-cmd/wallet-core-flutter.git
      ref: d93b9da594cc8ce4049dd687e03620727c88c149

dev_dependencies:
  build_runner: ^2.10.0
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  wallet_core_platform_interface:
    git:
      url: https://github.com/grantsamuel72-cmd/wallet-core-flutter.git
      ref: d93b9da594cc8ce4049dd687e03620727c88c149
      path: packages/wallet_core_platform_interface

flutter:
