name: wallet_cloud_backup
description: >-
  Cross-platform encrypted wallet backups for Flutter: iCloud Drive on iOS and
  Google Drive appDataFolder on Android.
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

platforms:
  android:
  ios:

dependencies:
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  http: ^1.6.0
  icloud_storage_plus: ^4.0.0
  wallet_core:
    git:
      url: https://github.com/grantsamuel72-cmd/wallet-core-flutter.git
      ref: d93b9da594cc8ce4049dd687e03620727c88c149

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  google_sign_in_platform_interface: ^3.1.0
  plugin_platform_interface: ^2.1.8
  wallet_core_platform_interface:
    git:
      url: https://github.com/grantsamuel72-cmd/wallet-core-flutter.git
      ref: d93b9da594cc8ce4049dd687e03620727c88c149
      path: packages/wallet_core_platform_interface
